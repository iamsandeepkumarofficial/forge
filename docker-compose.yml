services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - forge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: forge-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  temporal:
    image: temporalio/temporal:latest
    container_name: temporal-dev
    ports:
      - "7233:7233"
      - "8233:8233"
    command: ["server", "start-dev", "--ip", "0.0.0.0"]

  forge-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: forge-sandbox:latest
    profiles: ["sandbox-image"]

volumes:
  forge-data:
    driver: local
  minio-data:
    driver: local

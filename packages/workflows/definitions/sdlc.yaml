# SDLC pipeline — declarative definition interpreted by @forge/orchestrator.
#
# The orchestrator loads this file (via the `loadPipeline` activity) and walks
# the stages in order for each top-level board card. Editing this file changes
# the pipeline for NEW workflows; in-flight cards keep the version they started
# with (Temporal replays them deterministically).
#
# Stage fields:
#   id           unique stage key
#   agent        agent id, resolved against @forge/agents (system or per-user)
#   column       board column (chat_features.status) the card parks in
#   action       generate  = the agent produces an artifact (spec/review) as a comment
#                implement = tool-calling read/write loop inside the sandbox
#   commentTitle heading for the comment the stage posts on the card
#   gate         human = wait for a human to move the card out of this column on
#                        the board before continuing (put on the LAST stage of a
#                        column — earlier stages in it must be `auto`)
#                auto  = continue immediately
#
# `column` is any board column id (validated against the project's columns at
# runtime), so custom columns like `code_review` are supported. Multiple stages
# may share a column; they run in order, each posting a comment. Author stages in
# the board's left-to-right column order so the flow reads naturally.

name: sdlc
version: 2

stages:
  # ---- Planning & design (all park in `planning`) --------------------------
  - id: requirement
    agent: requirement-gatherer
    column: planning
    action: generate
    commentTitle: "🧭 Requirement"
    gate: auto

  - id: feasibility
    agent: technical-feasibility
    column: planning
    action: generate
    commentTitle: "📐 Technical feasibility"
    gate: auto

  - id: architecture
    agent: architecture-planning
    column: planning
    action: generate
    commentTitle: "🏛️ Architecture"
    gate: auto

  - id: data-model
    agent: data-modeler
    column: planning
    action: generate
    commentTitle: "🗄️ Data model"
    gate: auto

  - id: security-design
    agent: security-design
    column: planning
    action: generate
    commentTitle: "🔒 Security design"
    # Human reviews the full plan (requirement → security) and approves by
    # dragging the card Planning → Development.
    gate: human

  # ---- Implementation (park in `development`) ------------------------------
  - id: implementation
    agent: code-generation
    column: development
    action: implement
    commentTitle: "🛠️ Implementation"
    gate: auto

  - id: documentation
    agent: documentation
    column: development
    action: implement
    commentTitle: "📝 Documentation"
    gate: auto

  # ---- Verification & review (park in `qa`) -------------------------------
  - id: tests
    agent: test-generation
    column: qa
    action: implement
    commentTitle: "🧪 Tests"
    gate: auto

  - id: qa-run
    agent: qa-execution
    column: qa
    action: implement
    commentTitle: "✅ QA execution"
    gate: auto

  - id: code-review
    agent: code-review
    column: qa
    action: generate
    commentTitle: "👀 Code review"
    gate: auto

  - id: security-scan
    agent: vulnerability-scanner
    column: qa
    action: generate
    commentTitle: "🛡️ Security scan"
    # Human reviews QA + review + scan and releases by dragging QA → Done.
    gate: human

finalColumn: done
